apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
    stage: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      stage: prod
  template:
    metadata:
      labels:
        service: payment
        stage: prod
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: payment
        image: {{ .Values.payment.image | default (include "robot-shop.image" (list $ "rs-payment")) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if or .Values.payment.gateway .Values.payment.tracing.enabled }}
        env:
          {{- if .Values.payment.gateway }}
          - name: PAYMENT_GATEWAY
            value: {{ .Values.payment.gateway }}
          {{- end }}
          {{- if .Values.payment.tracing.enabled }}
          - name: OTEL_SERVICE_NAME
            value: payment
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: service.namespace={{ .Release.Namespace }},deployment.environment=capstone
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.payment.tracing.endpoint | quote }}
          {{- end }}
        {{- end }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            # Peak was 86 MiB of the old 100Mi limit before tracing was added;
            # the OpenTelemetry SDK needs room on top of that
            memory: 192Mi
          requests:
            cpu: 100m
            memory: 64Mi
      restartPolicy: Always
      {{- with .Values.payment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
